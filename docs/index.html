<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AA Franchise – เปิดร้านดี</title>

<meta name="theme-color" content="#be185d">
<style>
:root{--bg:#fff;--ink:#111;--muted:#6b6b70;--line:#ececef;--soft:#f4f4f6;--brand:#be185d;--brand-soft:#fdf0f6;--brand-ink:#9d174d;--grad:linear-gradient(135deg,#c81e66,#a81453);--glow:rgba(190,24,93,.34)}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e12;--ink:#f2f2f5;--muted:#a0a0ab;--line:#2a2a33;--soft:#1f1f27;--brand:#f472b6;--brand-soft:#3a1226;--brand-ink:#fbb6d6;--grad:linear-gradient(135deg,#f78bc2,#ec5aa5);--glow:rgba(244,114,182,.28)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "IBM Plex Sans","IBM Plex Sans Thai","Pretendard Variable","Noto Sans SC","Noto Sans Devanagari",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.logo span{display:flex;flex-direction:column;line-height:1.2}.logo .tag{font-size:12.5px;font-weight:500;color:var(--muted)}
.logo .mark{width:40px;height:40px;border-radius:13px;flex:none}.logo i{width:40px;height:40px;border-radius:13px;background:var(--grad);display:grid;place-items:center;color:#fff}
.langs{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.langs button{border:0;background:var(--soft);color:var(--ink);padding:6px 12px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.langs button:active{transform:scale(.95)}
.langs button[aria-pressed=true]{background:var(--brand-soft);color:var(--brand-ink);font-weight:600}
h1{font-size:clamp(28px,6vw,40px);line-height:1.25;margin:40px 0 12px;letter-spacing:-.01em}
.lead{color:var(--muted);font-size:18px;margin:0 0 24px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 8px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 26px;border-radius:999px;font-weight:600;font-size:17px;text-decoration:none;transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
.btn:active{transform:scale(.97)}
.btn svg{width:22px;height:22px;flex:0 0 auto}
.btn.all{background:var(--grad);color:#fff;box-shadow:0 10px 24px -10px var(--glow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:36px 0}
.card{background:var(--soft);border-radius:20px;padding:18px}
.card b{display:block;margin-bottom:4px}
.card p{margin:0;color:var(--muted);font-size:15px}
.note{background:var(--brand-soft);color:var(--brand-ink);border-radius:16px;padding:14px 16px;font-size:15px;margin:12px 0}
footer{color:var(--muted);font-size:14px;border-top:1px solid var(--line);margin-top:40px;padding-top:16px}
.rise{opacity:0;transform:translateY(14px);transition:opacity .45s ease-out,transform .45s ease-out}.rise.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rise{opacity:1;transform:none;transition:none}.btn,.langs button{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo"><img class="mark" src="icon.svg" width="40" height="40" alt=""><span>AA Franchise<small class="tag" data-k="tag"></small></span></div>
  <nav class="langs" aria-label="Language" id="langs"></nav>
</header>
<main>
  <h1 class="rise" data-k="h1"></h1>
  <p class="lead rise" data-k="lead"></p>
  <div class="cta rise">
    <a class="btn all" href="https://motoraathailand.github.io/" id="allapps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      <span data-k="all"></span>
    </a>
  </div>
  <div class="grid">
    <div class="card rise"><b data-k="c1t"></b><p data-k="c1d"></p></div>
    <div class="card rise"><b data-k="c2t"></b><p data-k="c2d"></p></div>
    <div class="card rise"><b data-k="c3t"></b><p data-k="c3d"></p></div>
    <div class="card rise"><b data-k="c4t"></b><p data-k="c4d"></p></div>
  </div>
  <div class="note rise" data-k="th_only"></div>
  <div class="note rise" data-k="ads"></div>
  <div class="note rise" data-k="disc"></div>
</main>
<footer data-k="foot"></footer>
</div>

en:{tag:"เปิดร้านดี · Open a good shop",h1:"Thailand franchise guide",lead:"Search brands, compare costs, fit your budget and read the start-up steps.",all:"See all apps",c1t:"Search & filter",c1d:"697 Thai brands, filtered by category and budget",c2t:"Compare",c2d:"Franchise fee, royalty and payback side by side",c3t:"Ask AI",c3d:"Use your own free AI key; answers come from the data on your phone, and the key never leaves it",c4t:"Start-up steps",c4d:"Company, tax, permits (reference only)",th_only:"This app is for Thailand only. 5 languages: Thai, English, Korean, Chinese, Hindi.",ads:"The test version has no ads; after the official launch only small banner ads will appear. Google sign-in is required to use the app.",disc:"Data comes from public sources and may be out of date. Not legal, tax or financial advice; confirm with the brand before you invest.",foot:"Operator: Pornnarai Tananchai · Contact: motoraathailand@gmail.com"},
ko:{tag:"เปิดร้านดี · 좋은 가게 열기",h1:"태국 프랜차이즈 가이드",lead:"브랜드 검색, 비용 비교, 예산 맞춤, 창업 절차를 한곳에서.",all:"모든 앱 보기",c1t:"검색·필터",c1d:"태국 브랜드 697개를 업종·예산으로 필터",c2t:"비교",c2d:"가맹비·로열티·회수 기간을 나란히",c3t:"AI에게 질문",c3d:"내 무료 AI 키로 폰에 저장된 데이터를 근거로 답해요. 키는 폰 밖으로 나가지 않아요",c4t:"창업 절차",c4d:"회사·세금·허가(참고용)",th_only:"이 앱은 태국 전용이에요. 5개 언어: 태국어·영어·한국어·중국어·힌디어.",ads:"테스트 버전에는 광고가 없고, 정식 출시 후에만 작은 배너 광고가 들어가요. 앱을 쓰려면 Google 로그인이 필요해요.",disc:"데이터는 공개 자료에서 모은 것이라 최신이 아닐 수 있어요. 법률·세무·재무 조언이 아니니 투자 전에 브랜드에 확인하세요.",foot:"운영자: Pornnarai Tananchai · 문의: motoraathailand@gmail.com"},
zh:{tag:"เปิดร้านดี · 开一家好店",h1:"泰国特许经营指南",lead:"搜索品牌、对比费用、按预算匹配并阅读创业流程。",all:"查看全部应用",c1t:"搜索与筛选",c1d:"697 个泰国品牌，按类别和预算筛选",c2t:"对比",c2d:"加盟费、特许权使用费和回本期并排对比",c3t:"问 AI",c3d:"使用你自己的免费 AI 密钥，基于手机里的数据回答，密钥不会离开手机",c4t:"创业流程",c4d:"公司、税务、许可（仅供参考）",th_only:"本应用仅面向泰国，支持 5 种语言：泰语、英语、韩语、中文、印地语。",ads:"测试版没有广告，正式上线后只会出现小型横幅广告。 使用应用需要先用 Google 登录。",disc:"数据来自公开资料，可能已过时，不构成法律、税务或财务建议，投资前请向品牌方确认。",foot:"运营者：Pornnarai Tananchai · 联系：motoraathailand@gmail.com"},
hi:{tag:"เปิดร้านดี · अच्छी दुकान खोलें",h1:"थाईलैंड फ्रेंचाइज़ गाइड",lead:"ब्रांड खोजें, लागत की तुलना करें, बजट के अनुसार चुनें और शुरुआती चरण पढ़ें।",all:"सभी ऐप देखें",c1t:"खोज और फ़िल्टर",c1d:"697 थाई ब्रांड, श्रेणी और बजट से फ़िल्टर",c2t:"तुलना",c2d:"फ्रेंचाइज़ शुल्क, रॉयल्टी और भुगतान-वापसी आमने-सामने",c3t:"AI से पूछें",c3d:"अपनी मुफ़्त AI कुंजी से, फ़ोन के डेटा पर आधारित उत्तर; कुंजी फ़ोन से बाहर नहीं जाती",c4t:"शुरुआती चरण",c4d:"कंपनी, कर, अनुमति (केवल संदर्भ)",th_only:"यह ऐप केवल थाईलैंड के लिए है। 5 भाषाएँ: थाई, अंग्रेज़ी, कोरियाई, चीनी, हिन्दी।",ads:"टेस्ट संस्करण में विज्ञापन नहीं हैं; आधिकारिक लॉन्च के बाद केवल छोटे बैनर विज्ञापन दिखेंगे। ऐप उपयोग के लिए Google साइन-इन ज़रूरी है।",disc:"डेटा सार्वजनिक स्रोतों से है और पुराना हो सकता है। यह कानूनी, कर या वित्तीय सलाह नहीं है; निवेश से पहले ब्रांड से पुष्टि करें।",foot:"संचालक: Pornnarai Tananchai · संपर्क: motoraathailand@gmail.com"}};
const NAMES={th:"ไทย",en:"English",ko:"한국어",zh:"简体中文",hi:"हिन्दी"};
const codes=Object.keys(L);
function pick(){const q=new URLSearchParams(location.search).get('lang');if(codes.includes(q))return q;const nav=(navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language]);for(const l of nav){const b=String(l).toLowerCase().split('-')[0];if(codes.includes(b))return b}return 'en'}
function set(c){document.documentElement.lang=c;document.querySelectorAll('[data-k]').forEach(e=>e.textContent=L[c][e.dataset.k]);document.querySelectorAll('#langs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.c===c)));document.title='AA Franchise – เปิดร้านดี'}
const nav=document.getElementById('langs');codes.forEach(c=>{const b=document.createElement('button');b.type='button';b.dataset.c=c;b.textContent=NAMES[c];b.onclick=()=>set(c);nav.appendChild(b)});
set(pick());
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});document.querySelectorAll('.rise').forEach(e=>io.observe(e));
</script>
